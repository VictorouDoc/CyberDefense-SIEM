#!/usr/sbin/nft -f
#
# nftables firewall configuration for [ORGANIZATION] Bastion Host
#
# Network interfaces:
#   eth0 = XXX  (external / management)
#   eth1 = XXX (internal hospital network)
#
# This ruleset provides:
#   - Default-deny on INPUT and FORWARD
#   - Whitelisted IPs set (static, loaded at boot)
#   - Banned IPs set (dynamic, managed by the SIEM)
#   - Rate limiting on ICMP and new connections
#   - Forward chain controlling external-to-internal traffic
#   - Logging of dropped packets for forensics
#

flush ruleset

# ──────────────────────────────────────────────
# MAIN FILTER TABLE (IPv4 + IPv6)
# ──────────────────────────────────────────────
table inet filter {

    # ── Named sets ──────────────────────────────

    # Static whitelist — IPs that are NEVER blocked
    set whitelist {
        type ipv4_addr
        elements = {
           XXX
        }
    }

    # Dynamic banned set — populated by SIEM auto-ban
    # timeout flag allows per-element expiry (e.g. 1h bans)
    set banned {
        type ipv4_addr
        flags timeout
    }

    # Blocked destinations — C2 servers, malicious IPs
    # Blocks outbound traffic from internal hosts to known-bad destinations
    set blocked_dst {
        type ipv4_addr
        elements = {
            X.X.X.X,    # [C2_DOMAIN] C2 server (Hetzner)
        }
    }

    # Set for tracking SYN flood rate per source
    set ratelimit_syn {
        type ipv4_addr
        flags dynamic, timeout
        timeout 10s
    }

    # ── INPUT CHAIN ─────────────────────────────
    chain input {
        type filter hook input priority 0; policy drop;

        # --- Connection tracking ---
        ct state established,related accept
        ct state invalid drop

        # --- Loopback ---
        iif "lo" accept

        # --- Drop banned IPs early ---
        ip saddr @banned counter drop

        # --- Allow whitelisted IPs unconditionally ---
        ip saddr @whitelist accept

        # --- ICMP: allow but rate-limit ---
        icmp type echo-request limit rate 5/second burst 10 packets accept
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

        # --- Anti SYN-flood on new connections ---
        tcp flags syn limit rate 50/second burst 100 packets accept
        tcp flags syn drop

        # ── External interface (eth0) ──
        # SSH access (group ports 221-230)
        iif "eth0" tcp dport 22 accept
        iif "eth0" tcp dport 221-230 accept

        # SIEM web dashboard (group ports 8080-8090)
        iif "eth0" tcp dport 8080-8090 accept

        # HTTP/HTTPS (nginx reverse proxy)
        iif "eth0" tcp dport { 80, 443 } accept

        # Suricata / IDS log reception (if applicable)
        iif "eth0" tcp dport 1514 accept

        # DNS (if bastion acts as resolver)
        iif "eth0" udp dport 53 accept
        iif "eth0" tcp dport 53 accept

        # ── Internal interface (eth1) ──
        # Allow all traffic from the internal hospital network
        iif "eth1" ip saddr XXX accept

        # ── Logging of dropped packets ──
        # Rate-limited to prevent log flooding
        limit rate 10/second burst 20 packets log prefix "nftables-input-drop: " level warn
        counter drop
    }

    # ── FORWARD CHAIN ───────────────────────────
    # Controls traffic passing THROUGH the bastion
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Established/related flows
        ct state established,related accept
        ct state invalid drop

        # Drop banned IPs in transit (inbound AND outbound)
        ip saddr @banned counter drop
        ip daddr @banned counter drop

        # Block outbound to known C2/malicious destinations
        ip daddr @blocked_dst counter log prefix "nftables-c2-block: " drop

        # ── Internal → External: allow outbound ──
        iif "eth1" oif "eth0" accept

        # ── External → Internal: restrict to known services ──

        # HTTP/HTTPS to EHR server (192.168.1.102)
        iif "eth0" oif "eth1" ip daddr 192.168.1.102 tcp dport { 80, 443 } accept

        # DICOM to Orthanc server (192.168.1.71)
        # Only from internal — block external DICOM access
        # iif "eth0" oif "eth1" ip daddr 192.168.1.71 tcp dport { 4242, 8042 } drop

        # Mail (SMTP/POP3) to mail server (192.168.1.111)
        iif "eth0" oif "eth1" ip daddr 192.168.1.111 tcp dport { 25, 110, 143, 587, 993, 995 } accept

        # DNS forwarding
        iif "eth0" oif "eth1" udp dport 53 accept
        iif "eth0" oif "eth1" tcp dport 53 accept

        # ── Block sensitive services from external access ──
        # SMB/Samba (192.168.1.30) — NEVER accessible externally
        iif "eth0" oif "eth1" ip daddr 192.168.1.30 tcp dport { 139, 445 } counter drop

        # Redis (192.168.1.106) — NEVER accessible externally
        iif "eth0" oif "eth1" ip daddr 192.168.1.106 tcp dport 6379 counter drop

        # DICOM (192.168.1.71) — NEVER accessible externally
        iif "eth0" oif "eth1" ip daddr 192.168.1.71 tcp dport { 4242, 8042 } counter drop

        # Log dropped forwarded traffic
        limit rate 5/second burst 10 packets log prefix "nftables-forward-drop: " level warn
        counter drop
    }

    # ── OUTPUT CHAIN ────────────────────────────
    chain output {
        type filter hook output priority 0; policy accept;

        # Allow all outbound traffic from the bastion
        # (needed for DNS resolution, updates, SIEM queries, etc.)
    }
}

# ──────────────────────────────────────────────
# NAT TABLE (if bastion does masquerading)
# ──────────────────────────────────────────────
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # Masquerade internal traffic going out via eth0
        oif "eth0" ip saddr XXX masquerade
    }
}
