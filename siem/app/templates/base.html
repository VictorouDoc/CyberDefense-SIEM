<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIEM{% endblock %} - [ORGANIZATION] SOC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1a1a2e; color: #eee; }
        .navbar { background-color: #16213e !important; }
        .card { background-color: #0f3460; border: none; }
        .card-header { background-color: #1a1a40; border-bottom: 1px solid #333; }
        .table { color: #eee; }
        .table-dark { background-color: #16213e; }
        .badge-critical { background-color: #dc3545; }
        .badge-high { background-color: #fd7e14; }
        .badge-medium { background-color: #ffc107; color: #000; }
        .badge-low { background-color: #17a2b8; }
        .badge-info { background-color: #6c757d; }
        .sidebar { background-color: #16213e; min-height: calc(100vh - 56px); }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover { color: #fff; background-color: #1a1a40; }
        .sidebar .nav-link.active { color: #fff; background-color: #0f3460; }
        .stat-card { border-left: 4px solid; }
        .stat-card.packets { border-color: #17a2b8; }
        .stat-card.events { border-color: #28a745; }
        .stat-card.alerts { border-color: #dc3545; }
        .stat-card.critical { border-color: #fd7e14; }
        /* UX FIX: Better text visibility on dark theme */
        .text-muted { color: #a0aec0 !important; }
        .card-subtitle { color: #a0aec0 !important; }
        .card-title { color: #fff !important; }
        .card-body h2, .card-body h3, .card-body h4, .card-body h5, .card-body h6 { color: #fff; }
        a { color: #63b3ed; }
        a:hover { color: #90cdf4; }
        .table a { color: #63b3ed; }
        .table a:hover { color: #90cdf4; }
        .breadcrumb-item a { color: #63b3ed; }
        .breadcrumb-item.active { color: #a0aec0; }
        .form-control, .form-select {
            background-color: #1a1a40;
            border-color: #333;
            color: #eee;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a1a40;
            border-color: #63b3ed;
            color: #eee;
            box-shadow: 0 0 0 0.2rem rgba(99, 179, 237, 0.25);
        }
        .form-control::placeholder { color: #6c757d; }
        .page-link {
            background-color: #1a1a40;
            border-color: #333;
            color: #63b3ed;
        }
        .page-link:hover {
            background-color: #0f3460;
            border-color: #333;
            color: #90cdf4;
        }
        .page-item.disabled .page-link {
            background-color: #16213e;
            border-color: #333;
            color: #6c757d;
        }
        /* FORCE ALL TEXT WHITE on dark theme */
        *, *::before, *::after { color: inherit; }
        body { color: #eee !important; }
        p, li, td, th, span, div, label, small, strong, em,
        pre, code, blockquote, figcaption, legend, dt, dd,
        h1, h2, h3, h4, h5, h6,
        .card-header, .card-body, .card-footer,
        .list-group-item, .breadcrumb-item,
        .alert, .form-control, .form-select,
        input, textarea, select, option, button { color: #eee !important; }
        h1, h2, h3, h4, h5, h6, .card-header, strong, b, th { color: #fff !important; }
        a, a:visited, .table a { color: #63b3ed !important; }
        a:hover { color: #90cdf4 !important; }
        code, pre, .text-monospace { color: #63b3ed !important; }
        .text-muted, .card-subtitle { color: #a0aec0 !important; }
        .badge.bg-warning.text-dark { color: #000 !important; }
        .badge.bg-success, .badge.bg-danger, .badge.bg-primary,
        .badge.bg-info, .badge.bg-secondary, .badge.bg-dark { color: #fff !important; }
        .btn { color: #fff !important; }
        hr { border-color: #333 !important; }
        .sidebar .nav-link { color: #adb5bd !important; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff !important; }
        /* DDoS/Ban status indicator */
        .status-badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; }
        .ban-active { background-color: #dc3545 !important; }
        .ban-expired { background-color: #6c757d !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-check"></i> [ORGANIZATION] SIEM
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <i class="bi bi-circle-fill text-success"></i> Monitoring Active
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar py-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint|default('') == 'packets.list_packets' %}active{% endif %}" href="/packets">
                            <i class="bi bi-box-arrow-in-right"></i> Packets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'explore' in request.endpoint|default('') %}active{% endif %}" href="/packets/explore">
                            <i class="bi bi-search"></i> Packet Explorer
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'events' in request.endpoint|default('') %}active{% endif %}" href="/events">
                            <i class="bi bi-list-check"></i> Events
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'alerts' in request.endpoint|default('') %}active{% endif %}" href="/alerts">
                            <i class="bi bi-exclamation-triangle"></i> Alerts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'firewall' in request.endpoint|default('') %}active{% endif %}" href="/firewall">
                            <i class="bi bi-shield-lock"></i> Firewall
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'killchain' in request.endpoint|default('') %}active{% endif %}" href="/killchain">
                            <i class="bi bi-diagram-3"></i> Kill Chain
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-10 ms-sm-auto px-4 py-3">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
